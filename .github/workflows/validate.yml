name: Repository checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  repository-and-workflows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: python -m pip install pyyaml pymupdf python-docx openpyxl
      - run: python scripts/check_repository.py
      - run: python -m unittest discover -s scripts/tests
      - run: python examples/chapter-parallel/calculate.py
      - name: Workbench tests
        working-directory: tools/harness-workbench
        run: |
          python -m unittest discover -s tests
          node --test tests/*.test.cjs
      - name: MathorCup behavior tests
        working-directory: skills/01-core/contest-orchestrator
        run: python -m unittest discover -s tests -p 'test_mathorcup*.py'
      - name: Harness behavior tests
        working-directory: skills/01-core/contest-orchestrator
        run: |
          python -m unittest discover -s tests -p 'test_harness*.py'
          python -m unittest discover -s tests -p 'test_h6_verification_scope.py'
      - name: Scope and incremental validation tests
        working-directory: skills/01-core/contest-orchestrator
        run: |
          python -m unittest discover -s tests -p 'test_mode_router.py'
          python -m unittest discover -s tests -p 'test_scope_router_results.py'
          python -m unittest discover -s tests -p 'test_incremental_verification.py'
          python -m unittest discover -s tests -p 'test_runtime_hardening.py'
      - name: Public experience import tests
        working-directory: skills/01-core/contest-orchestrator
        run: python -m unittest discover -s tests -p 'test_public_jsonl_limitations.py'
      - name: Health checker layout tests
        working-directory: skills/01-core/contest-orchestrator
        run: python -m unittest discover -s tests -p 'test_skill_health*.py'
      - name: ModelViz template provenance tests
        working-directory: skills/04-figures/modelviz
        run: |
          python -m pip install 'pytest>=8,<9' 'langchain-core>=0.3,<2' 'pandas>=2,<4' 'pillow>=10'
          python -m pytest tests/test_final_template_selection.py tests/test_template_adaptation.py -q
      - name: CUMCM template contract tests
        working-directory: skills/03-writing/mathmodel-latex-skill
        run: python -m unittest discover -s tests
