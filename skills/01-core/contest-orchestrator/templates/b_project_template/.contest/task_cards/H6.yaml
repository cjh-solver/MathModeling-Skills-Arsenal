# H6 节点任务卡：输入、范围、输出、验证要求
task_id: <H6 实际任务 ID>
node_id: H6
owner_role: 验证 agent
objective: H6 节点任务
inputs:
- path: problem_statement.md
  sha256: <sha256>
- path: validation_contract.yaml
  sha256: <sha256>
- path: model_summary_cards.yaml
  sha256: <sha256>
- path: h6_verification_scope.yaml
  sha256: <sha256>
- path: result_interpretation_cards.yaml
  sha256: <sha256>
- path: visual_evidence_packet.yaml
  sha256: <sha256>
scope: 受控范围
required_outputs:
- 节点产物
- model_summary_cards.yaml（核验后 status=verified）
- visual_evidence_packet.yaml（核验后 status=verified，并登记当前 H6 实例）
verification:
- 节点检查
- python scripts/check_h6_verification_scope.py h6_verification_scope.yaml
prohibited_actions:
- 越权
evidence_handoff:
- 回流记录
model: gpt-5.6-sol
reasoning_effort: high
